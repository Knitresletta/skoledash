<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype: fritt oppsett</title>
<link rel="stylesheet" href="fritt.css">
</head>
<body>
  <!-- Prototype for modell A: kortene står fritt på en flate som fyller skjermen.
       Ikke en del av appen. Mappa prototype/ slettes før branchen merges. -->
  <header id="linje">
    <strong>Prototype: fritt oppsett</strong>
    <button id="btn-nytt" type="button">+ Nytt kort</button>
    <button id="btn-nullstill" type="button">Nullstill</button>
    <label><input id="vis-hint" type="checkbox" checked> Vis hint</label>
    <span id="hint">Dra i toppen for å flytte, i kantene for å endre størrelse. Hold Alt for å slippe magnetene.</span>
  </header>
  <main id="flate"></main>
  <script src="fritt.js"></script>
</body>
</html>
